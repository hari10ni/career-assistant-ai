<!DOCTYPE html>
<html>

<head>

    <title>Resume Analyzer</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f7fb;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        .upload-box{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        button{
            background:#b8336a;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
        }

        .analysis-box{
            margin-top:30px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .score-card{
            background:#b8336a;
            color:white;
            padding:20px;
            border-radius:12px;
            margin-bottom:20px;
        }

        .progress{
            width:100%;
            background:#dbeafe;
            border-radius:10px;
            overflow:hidden;
            height:20px;
        }

        .progress-fill{
            width:80%;
            height:20px;
            background: #b8336a;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Resume Analyzer</h1>

    <div class="upload-box">

        <p>Upload your resume and get ATS feedback.</p>

        <form method="POST" enctype="multipart/form-data">

            <input
                type="file"
                name="resume"
                accept=".pdf,.docx,.txt"
                required
            >

            <br><br>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

    {% if analysis %}

    <div class="analysis-box">

        <div class="score-card">

            <h2>ATS Analysis</h2>

            <div class="progress">
                <div class="progress-fill"></div>
            </div>

            <p>ATS Score Generated By AI</p>

        </div>

        <h2>AI Resume Analysis</h2>

        <div class="markdown-content">
            {{ analysis | markdown | safe }}
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
