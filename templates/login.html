<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Career Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Welcome Back 👋</h1>

        <p>Login to continue using AI Career Assistant</p>

        <form action="/login" method="POST">

            <input 
                type="email" 
                name="email" 
                placeholder="Email Address" 
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </p>

    </div>

</div>

</body>
</html>
