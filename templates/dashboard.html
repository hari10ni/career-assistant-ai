<!DOCTYPE html>
<html>
<head>
    <title>CareerPilot Dashboard</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f7fb;
            margin:0;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#1e3a8a;
        }

        .stats{
            display:flex;
            justify-content:center;
            gap:30px;
            margin-top:40px;
        }

        .card{
            background:white;
            width:250px;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .number{
            font-size:40px;
            font-weight:bold;
            color:#2563eb;
        }

    </style>

</head>
<body>

    <h1>CareerPilot Dashboard</h1>

    <div class="stats">

        <div class="card">

            <h2>Total Conversations</h2>

            <div class="number">
                {{ stats.total_conversations }}
            </div>

        </div>

        <div class="card">

            <h2>Total Messages</h2>

            <div class="number">
                {{ stats.total_messages }}
            </div>

        </div>

    </div>

</body>
</html>
